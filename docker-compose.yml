version: '3.8'

services:
  # --- 1. INFRAESTRUTURA DE MENSAGERIA (KAFKA) ---
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-kraft
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_NUM_PARTITIONS=12
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_HEAP_OPTS=-Xmx4G -Xms4G

  # --- 2. INFRAESTRUTURA DE ARMAZENAMENTO (HADOOP HDFS) ---
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=transactions
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_blocksize=134217728

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_blocksize=134217728

  # --- 3. PRODUTOR (SPRING BOOT - JAVA) ---
  producer-spring:
    build: ./transaction.producer
    container_name: producer-spring
    depends_on:
      - kafka

  # --- 4. MICROSSERVIÇOS DE PROCESSAMENTO (PYTHON) ---
  fraud-router:
    build: ./router.app
    depends_on:
      - kafka
    restart: always

  # Escritor HDFS 1: Grava Transações Legítimas
  hdfs-writer-ok:
    build: ./hdfs_writer
    environment:
      - KAFKA_TOPIC=transacoes.ok
      - HDFS_TARGET_DIR=/data/transacoes_ok
      - CONSUMER_GROUP_ID=hdfs-writer-ok-group
    depends_on:
      - kafka
      - namenode
    restart: always

  # Escritor HDFS 2: Grava Transações Golpistas
  hdfs-writer-fraud:
    build: ./hdfs_writer_fraud
    environment:
      - KAFKA_TOPIC=transacoes.fraud
      - HDFS_TARGET_DIR=/data/transacoes_fraud
      - CONSUMER_GROUP_ID=hdfs-writer-fraud-group
    depends_on:
      - kafka
      - namenode
    restart: always